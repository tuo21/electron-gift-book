[package]
name = "gift-book"
version = "1.10.3"
description = "电子礼金簿 - 传统礼金记录管理应用"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# 锁定 Tauri 版本以确保 Windows 7 兼容性
tauri = { version = "2.0.0", features = ["devtools"] }
tauri-plugin-log = "2.0.0"
tauri-plugin-sql = { version = "2.0.0", features = ["sqlite"] }
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-shell = "2.0.0"
tauri-plugin-http = "2.0.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
# sqlx 版本必须与 tauri-plugin-sql 依赖的版本一致
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
lazy_static = "1.4"
calamine = "0.24"
zip = "2.0"
base64 = "0.21"
ttf-parser = "0.20"
font-kit = { version = "0.14" }
# 激活系统依赖
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
data-encoding = "2.4"

# Windows 7 兼容性配置
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "wingdi", "winbase", "libloaderapi", "processthreadsapi", "handleapi", "sysinfoapi"] }
winreg = "0.55"
